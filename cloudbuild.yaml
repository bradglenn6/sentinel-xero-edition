# ==============================================================================
# ZeroLabz Sentinel: Xero Edition - Google Cloud Build Configuration
# Automated container build, Artifact Registry push, and Cloud Run deployment
# ==============================================================================

steps:
  # Step 1: Build the production Docker image using caching
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - 'us-central1-docker.pkg.dev/gen-lang-client-0973854052/zerolabz-registry/sentinel-xero:latest'
      - '-t'
      - 'us-central1-docker.pkg.dev/gen-lang-client-0973854052/zerolabz-registry/sentinel-xero:$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/gen-lang-client-0973854052/zerolabz-registry/sentinel-xero:latest'
      - '.'

  # Step 2: Push the tagged container images to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/gen-lang-client-0973854052/zerolabz-registry/sentinel-xero'

  # Step 3: Deploy the container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'sentinel-xero-service'
      - '--image=us-central1-docker.pkg.dev/gen-lang-client-0973854052/zerolabz-registry/sentinel-xero:$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=NODE_ENV=production'

images:
  - us-central1-docker.pkg.dev/gen-lang-client-0973854052/zerolabz-registry/sentinel-xero:latest
  - us-central1-docker.pkg.dev/gen-lang-client-0973854052/zerolabz-registry/sentinel-xero:$BUILD_ID