name: Deploy Sentinel Xero Edition

on:
  push:
    branches:
      - master

env:
  PROJECT_ID: gen-lang-client-0973854052

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Required for Workload Identity Federation OIDC

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and Deploy via Cloud Build
        run: |
          BUILD_ID=$(gcloud builds submit --config cloudbuild.yaml --async --format="value(id)" .)
          echo "Triggered Cloud Build ID: $BUILD_ID"
          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --format="value(status)")
            echo "Current build status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then
              echo "Deployment succeeded!"
              exit 0
            elif [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "INTERNAL_ERROR" ] || [ "$STATUS" = "TIMEOUT" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "Build failed with status: $STATUS"
              exit 1
            fi
            sleep 10
          done