name: Deploy Sentinel Xero Edition

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  PROJECT_ID: gen-lang-client-0973854052

jobs:
  conftest-crypto-gate:
    uses: ./.github/workflows/fips203-gate.yml
    permissions:
      contents: read
      security-events: write

  generate-cbom:
    uses: ./.github/workflows/cbom.yml
    permissions:
      contents: read

  deploy:
    needs: [conftest-crypto-gate, generate-cbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and Deploy via Cloud Build
        run: |
          BUILD_ID=$(gcloud builds submit --config cloudbuild.yaml --async --format="value(id)" .)
          echo "Triggered Cloud Build ID: $BUILD_ID"
          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --format="value(status)")
            echo "Current build status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then
              echo "Deployment succeeded!"
              exit 0
            elif [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "INTERNAL_ERROR" ] || [ "$STATUS" = "TIMEOUT" ] || [ "$STATUS" = "CANCELLED" ] || [ "$STATUS" = "EXPIRED" ]; then
              echo "Build failed with status: $STATUS"
              exit 1
            fi
            sleep 10
          done
